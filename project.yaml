  conventions:
    # 2026-10-07 (A53, an agent default for the developer's review): STEP-14..STEP-19 added for the career run's
    # M1-M6; was "(STEP-00 .. STEP-13)".
    - "ROADMAP step numbers are stable task ids (STEP-00 .. STEP-19; STEP-14..19 are the career run's milestones M1-M6, ROADMAP 12); never renumber them."
    - "ROADMAP Done-when checkboxes are ticked by the developer; the three-marker index in docs/task/README.md is generated from .project/state.json and never replaces them."
    # 2026-09-27: the next convention replaces "A design change is one line with a reason in docs/DECISIONS.md;
    # the GDD is not rewritten (ROADMAP Step 0 pitfalls)." The v1.1 docs (DECISIONS.md header, GDD 12) now update
    # the GDD section after the superseding row. Semantic change (approval_required_for): confirmed by the developer
    # in chat on 2026-09-27 ("That is OK").
    - "A design change is first a new one-line row with a reason in docs/DECISIONS.md, superseding (never rewriting) the old row; then the GDD section it points to is updated to match (DECISIONS.md header; GDD 12; ROADMAP Step 0 pitfalls)."
    - "Claude never changes a design decision silently; open questions go to the step's design huddle (ROADMAP 10)."
    - "Scope is tagged MUST / SHOULD / LATER; a new idea replaces something and never just adds; new ideas go to docs/ideas_parking_lot.md (ROADMAP 1, risk 1)."
    - "ARCHITECTURE section 17 code skeletons are copied verbatim."
    - "Tuning lives in the 11 .tres files and text in the 18 JSON files; rebalancing never needs a script edit (ROADMAP 1)."
    # 2026-09-27 (W3, W6; developer approved in chat): replaces "Every step keeps its You-do task for the developer's own hands;
    # Claude does not do it for them (ROADMAP 4, risk 8)." Still true; the placeholder and no-quiz rules are added.
    # 2026-09-29 (W7; the developer in the Step 7 review: "You do" learning exercises are suspended and Claude
    # implements the features from now on): replaces "Every step keeps its You-do task for the developer; Claude
    # never does it. Where a You-do produces something the game needs to run, Claude builds a plain placeholder and
    # the proper version stays queued for the developer. Explanation checks are recorded from the developer's
    # statement and never quizzed (DECISIONS W3, W6)."
    - "The You-do learning exercises are suspended (DECISIONS W7, superseding W3): Claude builds those features too and queues no new ones. What only the developer can do stays theirs: installs, signing, iPhone checks, and sign-offs on scope, tone and tips. Explanation checks are recorded from the developer's statement and never quizzed (W6)."
    # 2026-09-27 (W1; developer approved in chat: "You can also push with git without stopping for my approvals"): replaces
    # "The developer commits; Claude suggests the message and commits before script_patch or engine updates (ROADMAP 10, ARCHITECTURE 14.3)."
    - "Claude commits after each verified increment on a per-step branch (step-NN-<slug>, each branched from the previous step's branch) and pushes without asking; it still commits before script_patch or engine updates. The developer reviews and merges on GitHub in step order with merge commits (DECISIONS W1; ARCHITECTURE 14.3)."
    - "Dependency gate: a step may start when every earlier step is done or has only developer-owned criteria left (device, manual review; You-do exercises are suspended, W7); those steps stay in_progress/verifying until the developer confirms (DECISIONS W2)."
    # 2026-10-07 (W9, the developer: "M1 should start now"): an exception to the gate above.
    - "M1, the career run's sim core (STEP-14), starts ahead of the open Steps 7-13 (DECISIONS W9); the dependency gate still orders Steps 7-13 among themselves. Where STEP-15..19 sit against Steps 7-13 is settled (MC-01, D-33): the art and release steps come after M4."
    - "While the developer is away, design huddles take the documented recommended default, logged in docs/DECISIONS.md as 'agent default, please review'; scope, tone and tip accuracy wait for the developer (DECISIONS W4)."
    # 2026-10-07: the last sentence was "Phase 2 is not designed or built until the developer decides
    # (docs/ideas_parking_lot.md)"; the Run Spec v1 is that design now (W8).
    - "Current mode (2026-09-27): PC only (P2); autonomous run from Step 2's PC part through Step 6, with a summary after each step (DECISIONS W5). Since 2026-09-29 the developer's review fixes are built on the Step 7 branch (step-07-dev-review). Since 2026-10-07 the Run Spec v1 is the working life (W8), built as M1-M6 (STEP-14..19), M1 next (W9)."
    - "The 2x rule: a task past twice its estimate stops and is cut or simplified (ROADMAP 1)."
    - "Two machines share the GitHub repo: everyday building on the Windows PC, iPhone builds on the MacBook; pull before you start, push before you switch, and run the same Godot 4.7.2 on both (ROADMAP 10; ARCHITECTURE 14.1)."
  status_dimensions:
    - execution
    - relevance
  approval_required_for:
    - remove
    - semantic_change
    - authority_change

