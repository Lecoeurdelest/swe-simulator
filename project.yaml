    milestone: v0.5-mvp

verification:
  thresholds:
    standard: 0.95
    critical: 0.99
  calibration_required_for_auto_advance: true
  calibration_status: "none: no calibrated analyzer exists for GDScript here, so the automatic logic gate is never used to advance a task."
  completion_policy: >-
    ROADMAP policy: a step is done when every Done-when checkbox is met. Automated criteria need a current
    godot-ai test_run artifact; manual_review and device_observation criteria need the developer's
    confirmation recorded in .project/state.json. Manual confirmation is not automated confidence.
  test_command: "godot-ai test_run (res://tests/test_*.gd, 300 s budget)"
  comments: complex_logic_only
  complexity:
    cyclomatic_max: 10
    cognitive_max: 15
    nesting_max: 3
