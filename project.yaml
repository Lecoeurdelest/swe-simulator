  - {id: SHOULD-09, title: "Career Notebook and Settings", risk: standard, timeboxed: true, source: {file: docs/GDD.md, section: "10.2 item 9"}, acceptance: [{id: AC-SH-09, statement: "Shipped within the Step 8 timebox, or recorded on the cut list (Relaxed Timing is kept either way).", verification: [document_check]}]}
  - {id: SHOULD-10, title: "Haptics and 2 music loops", risk: standard, timeboxed: true, source: {file: docs/GDD.md, section: "10.2 item 10"}, acceptance: [{id: AC-SH-10, statement: "Shipped with Step 12, or recorded on the cut list.", verification: [document_check]}]}
  - {id: SHOULD-11, title: "Dana's per-company lines, 'laid off too' gag, video-call frame, prop swaps", risk: standard, timeboxed: true, source: {file: docs/GDD.md, section: "10.2 item 11"}, acceptance: [{id: AC-SH-11, statement: "Shipped within the Step 8 timebox, or recorded on the cut list.", verification: [document_check]}]}

  # ---------- Cross-cutting requirements from GDD and ROADMAP ----------
  - id: REQ-FLOW
    title: "The full MVP loop runs start to finish without a crash"
    risk: standard
    source: {file: docs/GDD.md, section: "4.1; ROADMAP 2"}
    acceptance:
      - {id: AC-S03-1, statement: "On the phone, Title > Intro > Background select > Hunt > Interview > Offer > Hired > Title, and Hunt > Plan B > Retry, work with thumbs only.", verification: [device_observation]}
      - {id: AC-S06-1, statement: "3 full runs on the phone (Easy, Medium, Hard) with no crash.", verification: [device_observation]}
  - id: REQ-UI
    title: "Touch-sized, readable UI at every supported screen size"
    risk: standard
    source: {file: docs/GDD.md, section: "2.7; 2.8; ARCHITECTURE 1.1, 10"}
    acceptance:
      - {id: AC-S03-4, statement: "Body text is monogram 16 and readable at arm's length; no button is shorter than 32 px.", verification: [manual_review, device_observation]}
      - {id: AC-S10-2, statement: "A pass at 480x270, 639x294 and 590x410, and a pass on the phone, show nothing broken.", verification: [manual_review, device_observation]}
      - {id: AC-S12-3, statement: "Every screen passes the arm's-length squint test.", verification: [device_observation]}
  - id: REQ-TONE
    title: "Satire and tone rules: punch up, the joke is a rule, it is funny"
    risk: standard
    source: {file: docs/GDD.md, section: "1.2; 1.3"}
    acceptance:
      - {id: AC-S05-5, statement: "The developer laughed at least once during the hunt grey-box.", verification: [manual_review]}
  - id: REQ-DECISIONS
    title: "Decision log: D1-D8 answered, one line each with a reason"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "Step 0; 1 best practice 11"}
    acceptance:
      - {id: AC-S00-3, statement: "docs/DECISIONS.md lists D1-D8, each with the developer's answer and one line of why.", verification: [document_check]}
  - id: REQ-TOOLCHAIN
    title: "Pinned toolchain: Godot 4.7.2 and matching export templates"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "Step 0 task 2; 8 risk 4"}
    acceptance:
      - {id: AC-S00-2, statement: "The Godot install will not update itself behind the developer's back.", verification: [manual_review]}
  - id: REQ-LEARN
    title: "The developer understands their own code"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "8 risk 8; 10 ground rules"}
    acceptance:
      - {id: AC-S01-6, statement: "The developer can explain in one sentence each: what an autoload is; why only change_phase() changes the phase; why the RNG state is saved as a string.", verification: [manual_review]}
  - id: REQ-PLAYTEST
    title: "Playtests show the loop is understandable, fair and funny"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "7; Step 7"}
    acceptance:
      - {id: AC-S07-1, statement: "3 of 5 testers finish a loop without help.", verification: [manual_review]}
      - {id: AC-S07-4, statement: "There is a ranked fix list, and its top 3 are fixed.", verification: [document_check]}
  - id: REQ-EDU
    title: "Players leave with a real career tip"
    risk: standard
    source: {file: docs/GDD.md, section: "1.4; 8"}
    acceptance:
      - {id: AC-S07-3, statement: "Each tester can name one career tip afterwards.", verification: [manual_review]}
  - id: REQ-BALANCE
    title: "Balance simulation within the GDD 5.12 bands (or the D8 bands)"
    risk: standard
    source: {file: docs/GDD.md, section: "5.12; 10.6; ARCHITECTURE 12.4"}
    acceptance:
      - {id: AC-S07-2, statement: "test_balance is green against the GDD 5.12 bands, or the new ones chosen for D8 and written in DECISIONS.md.", verification: [behavioral_test]}
      - {id: AC-S08-3, statement: "The sim has been rerun after Research; research pushes first-interview pass rates up by 10-15 points.", verification: [behavioral_test]}
  - id: REQ-SCOPE
    title: "Scope by priority and time; the cut list stays current"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "11; Step 8"}
    acceptance:
      - {id: AC-S08-4, statement: "The cut list is updated with every unbuilt SHOULD.", verification: [document_check]}
  - id: REQ-ART
    title: "One art style at vertical-slice quality everywhere"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "5; Steps 9-10; GDD 2.5-2.6"}
    acceptance:
      - {id: AC-S09-1, statement: "A screenshot of the interview could go on a store page.", verification: [manual_review]}
      - {id: AC-S09-3, statement: "The palette and sizes are written in the style guide.", verification: [document_check]}
      - {id: AC-S10-1, statement: "No magenta or grey placeholders are left.", verification: [manual_review]}
  - id: REQ-PERF
    title: "60 fps on a cheap Android phone; no crash in repeated runs"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "2 Technical; ARCHITECTURE 15"}
    acceptance:
      - {id: AC-S09-2, statement: "The finished interview runs at 60 fps on the developer's phone.", verification: [device_observation]}
      - {id: AC-S12-2, statement: "60 fps on a low-end phone.", verification: [device_observation]}
      - {id: AC-S13-2, statement: "10 clean runs on 3 different phones.", verification: [device_observation]}
      - {id: AC-DOD-17, statement: "60 fps on a cheap Android phone; no crash in 10 runs in a row.", verification: [device_observation]}
  - id: REQ-LICENSE
    title: "Every asset licensed and credited; parody names only"
    risk: critical
    source: {file: docs/ROADMAP.md, section: "2 Technical; 5 Licenses; GDD 1.3"}
    acceptance:
      - {id: AC-S12-4, statement: "The Credits screen lists every asset and its license, including the OFL text for Press Start 2P.", verification: [document_check]}
      - {id: AC-DOD-18, statement: "Every asset's license is recorded, and only parody names are used (the content lint enforces it).", verification: [document_check, behavioral_test]}
  - id: REQ-REL
    title: "Milestones and the Android release candidate"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "2 Milestones; Step 13; ARCHITECTURE 13.1"}
    acceptance:
      - {id: AC-S06-4, statement: "Tag v0.1-greybox exists at the end of Step 6.", verification: [document_check]}
      - {id: AC-S13-1, statement: "Every item in the ROADMAP section 2 checklist is ticked.", verification: [document_check]}
      - {id: AC-S13-3, statement: "Tag v0.5-mvp exists.", verification: [document_check]}

tasks:
  # One task per ROADMAP step. The step's "Tasks", "You do" and "Pitfalls" in docs/ROADMAP.md are the
  # detailed specification; bundles in .project/bundles/ collect the context for one step.
  # Estimate note: the ROADMAP's own step hours and the 2x rule replace the skill's 5-hour split guideline;
  # the numbered tasks inside each step are the work units.
  - id: STEP-00
    title: "Tools, decisions and reading"
    source: {file: docs/ROADMAP.md, section: "Step 0"}
    hours: 3
    requirement_ids: [MUST-01, REQ-TOOLCHAIN, REQ-DECISIONS]
    component_ids: [CMP-REPO, CMP-DOCS]
    decision_ids: [D1, D2, D3, D4, D5, D6, D7, D8]
    depends_on: []
    acceptance_ids: [AC-S00-1, AC-S00-2, AC-S00-3]
    outputs: [docs/DECISIONS.md]
    out_of_scope: ["Rewriting the GDD (ROADMAP Step 0 pitfalls)"]
  - id: STEP-01
    title: "Project foundation"
    source: {file: docs/ROADMAP.md, section: "Step 1"}
    hours: 3
    requirement_ids: [MUST-01, MUST-03, REQ-LEARN]
    component_ids: [CMP-REPO, CMP-CORE, CMP-AUTOLOAD, CMP-DATA, CMP-UI, CMP-TITLE, CMP-TESTS]
    decision_ids: [AD-01, AD-04, AD-05, AD-07, AD-08, AD-09]
    depends_on: []
    preconditions: ["Step 0 task 1 (git installed)"]
    acceptance_ids: [AC-S01-1, AC-S01-2, AC-S01-3, AC-S01-4, AC-S01-5, AC-S01-6]
    outputs: [project.godot, .gitignore, .gitattributes, core/, autoload/, data/types/, ui/components/safe_area_margin.gd, features/title/, tests/]
    out_of_scope: ["gui/theme/custom (Step 3)"]
  - id: STEP-02
    title: "Hello phone: the Android debug build"
    source: {file: docs/ROADMAP.md, section: "Step 2"}
    hours: 5
    timebox_hours: 6
    requirement_ids: [MUST-01, MUST-02, MUST-15]
    component_ids: [CMP-EXPORT, CMP-DEV, CMP-TITLE]
    decision_ids: [D1, AD-02, AD-10]
    depends_on: [STEP-01]
    acceptance_ids: [AC-S02-1, AC-S02-2, AC-S02-3, AC-S02-4, AC-S02-5, AC-S02-6, AC-S02-7]
