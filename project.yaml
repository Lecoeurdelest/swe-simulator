      revision: "uncommitted on top of 6f40919 (Windows PC, 2026-09-27); sha256 of the four v1.1 docs in the 2026-09-27 .project/generated-manifest.json inputs; docs/DECISIONS.md, which render.py does not hash, e46ddcee7e7d1be9644f11456aca81f2eb8d79ae9ed26a055ee03d5d019c05d8. Replace with the commit id once pushed."
