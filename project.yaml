    - "Run Spec v1 precedence (DECISIONS W8, the developer's instruction for the merge): the original docs win on pixel-art style, engine and language, code conventions, shipped UI conventions and existing characters; the Run Spec material wins on game design (run structure, systems, rules, numbers, events, endings) and supersedes every earlier work-loop note. A conflict neither rule settles is listed in docs/merge-report.md as an MC-nn with a proposed resolution and is never resolved silently. docs/run-spec-v1.md is archived input: the merged docs win over it."
    - "Execution state and evidence: .project/state.json and .project/evidence/."

