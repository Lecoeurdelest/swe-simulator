  # ---------- Cross-cutting requirements from GDD and ROADMAP ----------
  - id: REQ-FLOW
    title: "The full MVP loop runs start to finish without a crash"
    risk: standard
    source: {file: docs/GDD.md, section: "4.1; ROADMAP 2"}
    acceptance:
      - {id: AC-S03-1, statement: "On the iPhone, Title > Intro > Background select > Hunt > Interview > Offer > Hired > Title, and Hunt > Plan B > Retry, work with one thumb.", verification: [device_observation]}
      - {id: AC-S06-1, statement: "3 full runs on the iPhone (Easy, Medium, Hard) with no crash.", verification: [device_observation]}
  - id: REQ-UI
    title: "Touch-sized, readable UI at every supported screen size"
    risk: standard
    source: {file: docs/GDD.md, section: "2.7; 2.8; ARCHITECTURE 1.1, 10"}
    acceptance:
      - {id: AC-S03-4, statement: "Body text is monogram 16 and readable at arm's length; no hit area is smaller than 34x34 px.", verification: [manual_review, device_observation]}
      - {id: AC-S10-2, statement: "A pass at 270x480, 294x639 and 330x717, and a pass on the iPhone, show nothing broken.", verification: [manual_review, device_observation]}
      - {id: AC-S12-3, statement: "Every screen passes the arm's-length squint test.", verification: [device_observation]}
      - {id: AC-S02-11, statement: "monogram and Press Start 2P are crisp at 4x on the iPhone.", verification: [device_observation]}
      - {id: AC-S02-12, statement: "One-handed, every thumb-band button is reachable; any that aren't are written down.", verification: [device_observation, document_check]}
      - {id: AC-S02-16, statement: "A swipe up from the bottom edge needs two swipes to leave the game.", verification: [device_observation]}
  - id: REQ-TONE
    title: "Satire and tone rules: punch up, the joke is a rule, it is funny"
    risk: standard
    source: {file: docs/GDD.md, section: "1.2; 1.3"}
    acceptance:
      - {id: AC-S05-5, statement: "The developer laughed at least once during the hunt grey-box.", verification: [manual_review]}
  - id: REQ-DECISIONS
    title: "Decision log: D1-D8 and P1 answered, one line each with a reason"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "Step 0; 1 best practice 11"}
    acceptance:
      - {id: AC-S00-3, statement: "docs/DECISIONS.md lists D1-D8 and P1, each with the developer's answer and one line of why.", verification: [document_check]}
  - id: REQ-TOOLCHAIN
    title: "Pinned toolchain: Godot 4.7.2 on both machines and matching export templates"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "Step 0 task 2; 8 risk 4; ARCHITECTURE 13.1, 14.1"}
    acceptance:
      - {id: AC-S00-2, statement: "Steam won't update Godot on the Windows PC behind the developer's back (the MacBook uses the godotengine.org 4.7.2 zip, which never updates itself).", verification: [manual_review]}
  - id: REQ-LEARN
    title: "The developer understands their own code"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "8 risk 8; 10 ground rules"}
    acceptance:
      - {id: AC-S01-6, statement: "The developer can explain in one sentence each: what an autoload is; why only change_phase() changes the phase; why the RNG state is saved as a string.", verification: [manual_review]}
  - id: REQ-PLAYTEST
    title: "Playtests show the loop is understandable, fair and funny"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "7; Step 7"}
    acceptance:
      - {id: AC-S07-1, statement: "3 of 5 testers finish a loop without help.", verification: [manual_review]}
      - {id: AC-S07-4, statement: "There is a ranked fix list, and its top 3 are fixed.", verification: [document_check]}
  - id: REQ-EDU
    title: "Players leave with a real career tip"
    risk: standard
    source: {file: docs/GDD.md, section: "1.4; 8"}
    acceptance:
      - {id: AC-S07-3, statement: "Each tester can name one career tip afterwards.", verification: [manual_review]}
  - id: REQ-BALANCE
    title: "Balance simulation within the GDD 5.12 bands (or the D8 bands)"
    risk: standard
    source: {file: docs/GDD.md, section: "5.12; 10.6; ARCHITECTURE 12.4"}
    acceptance:
      - {id: AC-S07-2, statement: "test_balance is green against the GDD 5.12 bands, or the new ones chosen for D8 and written in DECISIONS.md.", verification: [behavioral_test]}
      - {id: AC-S08-3, statement: "The sim has been rerun after Research; research pushes first-interview pass rates up by 10-15 points.", verification: [behavioral_test]}
  - id: REQ-SCOPE
    title: "Scope by priority and time; the cut list stays current"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "11; Step 8"}
    acceptance:
      - {id: AC-S08-4, statement: "The cut list is updated with every unbuilt SHOULD.", verification: [document_check]}
  - id: REQ-ART
    title: "One art style at vertical-slice quality everywhere"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "5; Steps 9-10; GDD 2.5-2.6"}
    acceptance:
      - {id: AC-S09-1, statement: "A portrait screenshot of the interview could go on a store page.", verification: [manual_review]}
      - {id: AC-S09-3, statement: "The palette and sizes are written in the style guide.", verification: [document_check]}
      - {id: AC-S10-1, statement: "No magenta or grey placeholders are left.", verification: [manual_review]}
  - id: REQ-PERF
    title: "60 fps on the oldest iPhone the developer can borrow; no crash in repeated runs"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "2 Technical; ARCHITECTURE 15"}
    acceptance:
      - {id: AC-S09-2, statement: "The finished interview runs at 60 fps on the developer's iPhone.", verification: [device_observation]}
      - {id: AC-S12-2, statement: "60 fps on the oldest iPhone the developer can borrow.", verification: [device_observation]}
      - {id: AC-S13-2, statement: "10 clean runs on 3 different iPhones.", verification: [device_observation]}
      - {id: AC-DOD-17, statement: "60 fps on the oldest iPhone the developer can borrow; no crash in 10 runs in a row.", verification: [device_observation]}
  - id: REQ-LICENSE
    title: "Every asset licensed and credited; parody names only"
    risk: critical
    source: {file: docs/ROADMAP.md, section: "2 Technical; 5 Licenses; GDD 1.3"}
    acceptance:
      - {id: AC-S12-4, statement: "The Credits screen lists every asset and its license, including the OFL text for Press Start 2P.", verification: [document_check]}
      - {id: AC-DOD-18, statement: "Every asset's license is recorded, and only parody names are used (the content lint enforces it).", verification: [document_check, behavioral_test]}
  - id: REQ-REL
    title: "Milestones and the TestFlight release candidate (Android and Google Play LATER)"
    risk: standard
    source: {file: docs/ROADMAP.md, section: "2 Milestones; Step 13; ARCHITECTURE 13.1"}
    acceptance:
      - {id: AC-S06-4, statement: "Tag v0.1-greybox exists at the end of Step 6.", verification: [document_check]}
      - {id: AC-S13-1, statement: "Every item in the ROADMAP section 2 checklist is ticked.", verification: [document_check]}
      - {id: AC-S13-3, statement: "Tag v0.5-mvp exists.", verification: [document_check]}

tasks:
  # One task per ROADMAP step. The step's "Tasks", "You do" and "Pitfalls" in docs/ROADMAP.md are the
  # detailed specification; bundles in .project/bundles/ collect the context for one step.
  # Estimate note: the ROADMAP's own step hours and the 2x rule replace the skill's 5-hour split guideline;
  # the numbered tasks inside each step are the work units.
  - id: STEP-00
    title: "Tools, decisions and reading"
    source: {file: docs/ROADMAP.md, section: "Step 0"}
    hours: 3
    requirement_ids: [MUST-01, REQ-TOOLCHAIN, REQ-DECISIONS]
    component_ids: [CMP-REPO, CMP-DOCS]
    decision_ids: [D1, D2, D3, D4, D5, D6, D7, D8, P1]
    depends_on: []
    acceptance_ids: [AC-S00-1, AC-S00-2, AC-S00-3]
    outputs: [docs/DECISIONS.md]
    out_of_scope: ["Rewriting the GDD (ROADMAP Step 0 pitfalls)"]
  - id: STEP-01
    title: "Project foundation"
    source: {file: docs/ROADMAP.md, section: "Step 1"}
    hours: 3
    requirement_ids: [MUST-01, MUST-03, REQ-LEARN]
    component_ids: [CMP-REPO, CMP-CORE, CMP-AUTOLOAD, CMP-DATA, CMP-UI, CMP-TITLE, CMP-TESTS]
    decision_ids: [D1, D2, AD-11, AD-12, AD-04, AD-05, AD-07, AD-08, AD-09]
    depends_on: []
    preconditions: ["Step 0 task 1 (git installed)"]
    acceptance_ids: [AC-S01-1, AC-S01-2, AC-S01-3, AC-S01-4, AC-S01-5, AC-S01-6]
    outputs: [project.godot, .gitignore, .gitattributes, core/, autoload/, data/types/, ui/components/safe_area_margin.gd, features/title/, tests/]
    amendments: ["2026-09-26 portrait switch (D1, D2): viewport 270x480, window override 540x960, orientation 1; Device reads its base size from Project Settings (ROADMAP Step 1 status and task 10)"]
    out_of_scope: ["gui/theme/custom (Step 3)"]
  - id: STEP-02
    title: "Hello iPhone: the iOS debug build from the MacBook"
    source: {file: docs/ROADMAP.md, section: "Step 2"}
    hours: 5
    timebox_hours: 6
    machine: "MacBook (the device-check scene can be built on either machine)"
    requirement_ids: [MUST-01, MUST-02, MUST-15, REQ-UI]
    component_ids: [CMP-EXPORT, CMP-DEV, CMP-TITLE, CMP-UI]
    decision_ids: [D1, D2, P1, AD-11, AD-12, AD-13]
    depends_on: [STEP-01]
    preconditions: ["The Step 1 portrait commit is pushed", "The MacBook, the iPhone and its USB cable are at hand"]
    acceptance_ids: [AC-S02-8, AC-S02-9, AC-S02-10, AC-S02-11, AC-S02-12, AC-S02-13, AC-S02-14, AC-S02-15, AC-S02-16, AC-S02-17, AC-S02-18, AC-S02-19]
    superseded_acceptance_ids: [AC-S02-1, AC-S02-2, AC-S02-3, AC-S02-4, AC-S02-5, AC-S02-6, AC-S02-7]
    outputs: [features/dev/device_check.tscn, export_presets.cfg, ui/fonts/monogram/ttf/monogram.ttf, ui/fonts/PressStart2P-Regular.ttf, ui/fonts/OFL.txt, "docs/ARCHITECTURE.md section 18.1 results (and GDD 2.9 if the insets differ)"]
    out_of_scope: ["Android export and Google Play (LATER, ARCHITECTURE 13.2)", "The paid Apple Developer Program and TestFlight (Step 13)"]
    note: "Redefined on 2026-09-27 from the Android 'Hello phone' step (P1). AC-S02-1..7 were never evaluated; each links to its replacement."
  - id: STEP-03
    title: "Stub flow through every screen, plus the UI kit"
    source: {file: docs/ROADMAP.md, section: "Step 3"}
    hours: 8
    requirement_ids: [REQ-FLOW, MUST-03, MUST-04, MUST-15, REQ-UI]
    component_ids: [CMP-UI, CMP-DATA, CMP-TITLE, CMP-INTRO, CMP-BGSELECT, CMP-HUNT, CMP-INTERVIEW, CMP-ENDINGS]
    decision_ids: [D5, AD-03, AD-06]
    depends_on: [STEP-02]
    acceptance_ids: [AC-S03-1, AC-S03-2, AC-S03-3, AC-S03-4, AC-S03-5]
  - id: STEP-04
    title: "Interview grey-box"
    source: {file: docs/ROADMAP.md, section: "Step 4"}
    hours: 14
    requirement_ids: [MUST-03, MUST-09, MUST-10, MUST-11, MUST-14, MUST-15, MUST-17]
    component_ids: [CMP-INTERVIEW, CMP-CONTENT, CMP-CORE, CMP-TESTS, CMP-DEV]
    decision_ids: [D3, D8, C1]
    depends_on: [STEP-03]
    acceptance_ids: [AC-S04-1, AC-S04-2, AC-S04-3, AC-S04-4, AC-S04-5]
  - id: STEP-05
    title: "Job-hunt grey-box"
    source: {file: docs/ROADMAP.md, section: "Step 5"}
    hours: 16
    requirement_ids: [MUST-05, MUST-06, MUST-07, MUST-08, MUST-13, MUST-15, MUST-17, REQ-TONE]
    component_ids: [CMP-HUNT, CMP-BGSELECT, CMP-CONTENT, CMP-CORE, CMP-TESTS]
    decision_ids: [D4, D6]
    depends_on: [STEP-04]
    acceptance_ids: [AC-S05-1, AC-S05-2, AC-S05-3, AC-S05-4, AC-S05-5]
  - id: STEP-06
    title: "Offer, endings, save/resume, Back, intro text slides"
    source: {file: docs/ROADMAP.md, section: "Step 6"}
    hours: 10
    requirement_ids: [REQ-FLOW, MUST-12, MUST-13, MUST-15, MUST-16, MUST-17, REQ-REL]
    component_ids: [CMP-ENDINGS, CMP-INTRO, CMP-CONTENT, CMP-AUTOLOAD]
    decision_ids: [D7]
    depends_on: [STEP-05]
    acceptance_ids: [AC-S06-1, AC-S06-2, AC-S06-3, AC-S06-4]
    milestone: v0.1-greybox
  - id: STEP-07
    title: "Playtest #1, tuning and the balance sim"
    source: {file: docs/ROADMAP.md, section: "Step 7"}
    hours: 8
    requirement_ids: [REQ-PLAYTEST, REQ-EDU, REQ-BALANCE]
    component_ids: [CMP-TESTS, CMP-DEV, CMP-DATA]
    decision_ids: [D8]
    depends_on: [STEP-06]
    acceptance_ids: [AC-S07-1, AC-S07-2, AC-S07-3, AC-S07-4]
  - id: STEP-08
    title: "SHOULD features, in GDD 10.2 order"
    source: {file: docs/ROADMAP.md, section: "Step 8"}
    hours: 16
    timebox_hours: 16
    requirement_ids: [SHOULD-01, SHOULD-02, SHOULD-03, SHOULD-04, SHOULD-05, SHOULD-06, SHOULD-07, SHOULD-08, SHOULD-09, SHOULD-10, SHOULD-11, REQ-BALANCE, REQ-SCOPE]
    component_ids: [CMP-HUNT, CMP-ENDINGS, CMP-INTERVIEW, CMP-UI]
    decision_ids: [D7]
    depends_on: [STEP-07]
    acceptance_ids: [AC-S08-1, AC-S08-2, AC-S08-3, AC-S08-4]
    note: "SHOULD-03..11 are timeboxed: each is either shipped or moved to the cut list; only AC-S08-1..4 gate completion."
  - id: STEP-09
    title: "Art style lock and the vertical slice: the interview"
    source: {file: docs/ROADMAP.md, section: "Step 9"}
    hours: 20
    requirement_ids: [REQ-ART, REQ-PERF]
    component_ids: [CMP-ART, CMP-INTERVIEW, CMP-AUDIO]
    decision_ids: []
    depends_on: [STEP-07]
    acceptance_ids: [AC-S09-1, AC-S09-2, AC-S09-3]
  - id: STEP-10
    title: "Art production for the rest"
