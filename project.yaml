requirements:
  # ---------- GDD 10.1 MUST (ids keep the GDD numbering) ----------
  - id: MUST-01
    title: "Foundation: GDD 2.3 settings, Device scale guard and safe area, git files before the first commit"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 1; 2.2; 2.3; 2.9"}
    acceptance:
      - {id: AC-S00-1, statement: "Git works, user.name and user.email are set, and the repo is on GitHub.", verification: [document_check]}
      - {id: AC-S01-1, statement: "F5 shows the title stub reading window (540, 960) / game (270, 480) (integer), or, when the game is embedded in the Game tab, the size the ARCHITECTURE 1.1 rule predicts for that window.", verification: [manual_review]}
      - {id: AC-S01-2, statement: "Resizing the window changes the game size, and nothing blurs or stretches.", verification: [manual_review]}
      - {id: AC-S01-5, statement: "git status is clean, everything is pushed, and .godot/ is not tracked.", verification: [document_check]}
      - {id: AC-S02-2, statement: "On the phone, the readout shows the game size ARCHITECTURE 1.1 predicts for that screen.", verification: [device_observation], relevance: superseded, superseded_by: [AC-S02-9], superseded_on: "2026-09-27", reason: "P1 iPhone first (ROADMAP v1.1 Step 2)"}
      - {id: AC-S02-3, statement: "On the phone, the safe-area outline clears the camera cutout.", verification: [device_observation], relevance: superseded, superseded_by: [AC-S02-10], superseded_on: "2026-09-27", reason: "P1 iPhone first (ROADMAP v1.1 Step 2)"}
      - {id: AC-S02-9, statement: "The readout shows the game size ARCHITECTURE 1.1 predicts for the iPhone model (for example, 1179x2556 gives 294x639 integer).", verification: [device_observation]}
      - {id: AC-S02-10, statement: "The safe-area outline clears the Dynamic Island (or notch) and the home indicator: about 45 top and 26 bottom game px on an iPhone 15 or 16.", verification: [device_observation]}
  - id: MUST-02
    title: "Debug build on the developer's own iPhone in week 1, from the MacBook (portrait lock, fonts, safe area, thumb reach, ScrollContainer release test, haptics)"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 2; 2.10"}
    acceptance:
      - {id: AC-S02-1, statement: "The app opens on the phone in landscape, both ways up.", verification: [device_observation], relevance: superseded, superseded_by: [AC-S02-8], superseded_on: "2026-09-27", reason: "D1 portrait, P1 iPhone first (ROADMAP v1.1 Step 2)"}
      - {id: AC-S02-5, statement: "The answer to 'does dragging the list fire a button?' is written down, and the scroll deadzone feels right.", verification: [device_observation, document_check], relevance: superseded, superseded_by: [AC-S02-13], superseded_on: "2026-09-27", reason: "P1 iPhone first (ROADMAP v1.1 Step 2)"}
      - {id: AC-S02-6, statement: "The Haptic button vibrates.", verification: [device_observation], relevance: superseded, superseded_by: [AC-S02-14], superseded_on: "2026-09-27", reason: "P1 iPhone first (ROADMAP v1.1 Step 2)"}
      - {id: AC-S02-7, statement: "Output from the phone appears in the editor (remote debug).", verification: [device_observation], relevance: superseded, superseded_by: [AC-S02-18], superseded_on: "2026-09-27", reason: "P1 iPhone first: remote debug with a Personal Team is unverified (ROADMAP v1.1 Step 2; ARCHITECTURE 13.1)"}
      - {id: AC-DOD-01, statement: "The game installs on the developer's iPhone from Xcode, opens in portrait (it never rotates), and reaches the title quickly.", verification: [device_observation]}
      - {id: AC-S02-8, statement: "The app opens on the iPhone in portrait and doesn't rotate.", verification: [device_observation]}
      - {id: AC-S02-13, statement: "Dragging the list never fires a button, and a deadzone of 6 feels right; the answer is written down.", verification: [device_observation, document_check]}
      - {id: AC-S02-14, statement: "The 40 ms haptic is felt, and whether the 10 ms one is felt is noted.", verification: [device_observation, document_check]}
      - {id: AC-S02-18, statement: "The developer knows where logs appear: Xcode's console, or Godot's Output panel with one-click deploy.", verification: [manual_review]}
      - {id: AC-S02-19, statement: "The install date is written down (the Personal Team build expires after 7 days).", verification: [document_check]}
  - id: MUST-03
    title: "Autoloads, pure classes, and godot-ai tests for every formula"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 3; 10.6"}
    acceptance:
      - {id: AC-S01-3, statement: "test_run shows 24 passed, 0 failed (flow 6, save 3, odds 8, interview 4, offer 3).", verification: [behavioral_test]}
      - {id: AC-S01-4, statement: "The Output panel shows no errors when the title stub runs.", verification: [manual_review]}
      - {id: AC-S03-5, statement: "test_run is still green after the stub flow.", verification: [behavioral_test]}
      - {id: AC-S04-5, statement: "test_run is green, including test_content_lint.", verification: [behavioral_test]}
      - {id: AC-DOD-13, statement: "All tests are green: flow, save, odds, interview, offer, content lint and balance.", verification: [behavioral_test]}
  - id: MUST-04
    title: "Title: static art, Tap to start, Continue"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 4; 4.2 S01"}
    acceptance:
      - {id: AC-DOD-02, statement: "The title offers tap-to-start, Continue when a save exists, and Replay intro.", verification: [manual_review]}
  - id: MUST-05
    title: "Background select: one background card (3 stat bars, pips, runway, perk, flaw), a 3-button selector, name dice"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 5; 5.2"}
    acceptance:
      - {id: AC-DOD-03, statement: "Background select shows one full-width card at a time (3 stat bars, energy pips, rent runway, 1 perk and 1 flaw), a 3-button selector, and a name dice button.", verification: [manual_review]}
  - id: MUST-06
    title: "Phone-app job hunt (DoomApply with a bottom dock)"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 6; 5.3; 5.6"}
    acceptance:
      - {id: AC-DOD-04, statement: "The job hunt is the DoomApply phone app with a bottom dock: 6 new cards per day, at most 10 on the board; card front shows logo, title, 3 match tags, a joke and the odds band; swipe right or APPLY = Quick Apply (1 energy); flip gives Tailor & Apply (2); Study (2); the Intern's 2 referrals; Sleep; energy, rent and Radar always visible.", verification: [behavioral_test, manual_review]}
  - id: MUST-07
    title: "CV screen: 3 lines x Honest / Polished / Lie"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 7; 5.4"}
    acceptance:
      - {id: AC-DOD-05, statement: "The CV screen has 3 lines, each settable to Honest, Polished or Lie.", verification: [manual_review]}
  - id: MUST-08
    title: "Morning inbox batch reveal, Recruiter Radar, first-run day-2 guarantee"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 8; 5.7"}
    acceptance:
      - {id: AC-S05-1, statement: "On a Medium first run, an invite arrives on the morning of day 2, after 3-5 minutes of play.", verification: [behavioral_test, manual_review]}
      - {id: AC-S05-2, statement: "Knockout rejections name the knockout, ghosts stay silent, and the Radar fills only with relevant applications.", verification: [behavioral_test, manual_review]}
      - {id: AC-DOD-06, statement: "The morning inbox shows invites first, rejections as one stack, ghosts silent; the first run guarantees an invite on day 2.", verification: [behavioral_test, manual_review]}
  - id: MUST-09
    title: "6 companies (2 per tier), 3 interview backgrounds; tiers differ at every stage"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 9; 5.5; 7"}
    acceptance:
      - {id: AC-S04-1, statement: "On the iPhone, interviews at the three tiers feel different: startup PIVOT, Big's fast needle.", verification: [device_observation]}
      - {id: AC-DOD-07, statement: "6 companies and 3 interview backgrounds exist; tiers differ in odds, reply speed, Doubt HP, needle speed, question pool, salary and work mode.", verification: [document_check, behavioral_test]}
  - id: MUST-10
    title: "VS intro (2 s, skippable after first view), player bust per background, Dana in 3 outfits"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 10"}
    acceptance:
      - {id: AC-DOD-08, statement: "The VS intro lasts 2 s, is skippable after the first view, and shows a bust for each background and Dana in 3 outfits.", verification: [manual_review]}
  - id: MUST-11
    title: "Interview: bars, 5 prompts, Answer Meter, lie probe, K.O. / wheel / rejection"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 11; 5.8"}
    acceptance:
      - {id: AC-S04-2, statement: "The player sees the odds (zone width) before the needle moves, the thumb never covers the needle, and Dana's reactions explain what happened.", verification: [manual_review]}
      - {id: AC-S04-3, statement: "Every outcome has been seen at least once: K.O., wheel win, wheel loss, Composure 0, BUSTED (via debug), and a rejection with a tip plus the model answer.", verification: [manual_review]}
      - {id: AC-DOD-09, statement: "The interview has Composure and Doubt bars, 5 prompts, the Answer Meter and the lie probe; it ends in K.O., the committee wheel or rejection; a loss always shows a tip plus the model answer.", verification: [behavioral_test, manual_review]}
  - id: MUST-12
    title: "Offer modal: role, yearly salary, work mode, commute preview, 2 perks, 1 fine print; Accept; Decline with confirm"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 12; 5.9"}
    acceptance:
      - {id: AC-DOD-10, statement: "The offer modal shows role, yearly salary, work mode, commute preview, 2 perks and 1 fine-print joke; Accept, or Decline with a confirm.", verification: [manual_review]}
  - id: MUST-13
    title: "Endings: Hired card with Dream vs Reality; Plan B with one-tap Retry; grace day"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 13; 5.10"}
    acceptance:
      - {id: AC-S05-3, statement: "Wasting energy until rent runs out reaches Plan B, with a grace day when an invite is waiting.", verification: [behavioral_test, manual_review]}
      - {id: AC-DOD-11, statement: "A Hired card with the Dream vs Reality score; a Plan B ending with one-tap Retry; a grace day when an invite is waiting.", verification: [manual_review]}
  - id: MUST-14
    title: "Ducky tip card after failures"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 14; 1.2 pillar 4; 8"}
    acceptance:
      - {id: AC-MUST-14, statement: "Every failure shows the joke, then the cause, then exactly one true career tip from Ducky.", verification: [manual_review, document_check]}
  - id: MUST-15
    title: "Autosave on every action and on pause; an on-screen Back on every screen (Android Back LATER); pause during interview on focus loss"
    risk: critical
    source: {file: docs/GDD.md, section: "10.1 item 15; 4.4; 5.11"}
    acceptance:
      - {id: AC-S02-4, statement: "On the phone, Back doesn't quit: the device-check counter goes up.", verification: [device_observation], relevance: superseded, superseded_by: [AC-S02-17], superseded_on: "2026-09-27", reason: "P1 iPhone first: iOS has no Back button, so the check is the on-screen Back (ROADMAP v1.1 Step 2; ARCHITECTURE 9)"}
      - {id: AC-S03-2, statement: "Quit to title mid-hunt makes Continue appear, and Continue resumes the hunt; after Plan B or after leaving the Hired card, Continue is gone.", verification: [behavioral_test, manual_review]}
      - {id: AC-S03-3, statement: "Every screen has an on-screen Back that does the right thing, and desktop Esc does the same.", verification: [manual_review]}
      - {id: AC-S04-4, statement: "Killing the app mid-interview (swiping it away in the app switcher), then Continue, replays the same questions.", verification: [behavioral_test, device_observation]}
      - {id: AC-S05-4, statement: "Killing the app right after Sleep (swiping it away in the app switcher), then Continue, shows the same morning.", verification: [behavioral_test, device_observation]}
      - {id: AC-S06-2, statement: "All 5 kill tests resume correctly; a kill on the Hired card resumes at the offer; leaving the Hired card clears the save.", verification: [device_observation]}
      - {id: AC-DOD-12, statement: "Autosave on every action and whenever the app loses focus; killing the app never loses more than the current screen; every screen has an on-screen Back (iOS has no Back button; Android Back is LATER); every control used more than once a day sits in the bottom 40%, within one thumb's reach.", verification: [behavioral_test, device_observation]}
      - {id: AC-S02-15, statement: "After going home and reopening, the PAUSED and RESUMED counters went up and the state is intact; Control Center raises FOCUS_OUT; haptics still work after resuming.", verification: [device_observation]}
      - {id: AC-S02-17, statement: "The on-screen Back counter goes up.", verification: [device_observation]}
  - id: MUST-16
    title: "Intro: 6 still panels with pans/tilts and captions, skippable; text slides first, art last"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 16; CONTENT 2"}
    acceptance:
      - {id: AC-S06-3, statement: "The intro can be skipped at any moment and never auto-plays again.", verification: [manual_review]}
      - {id: AC-S11-1, statement: "The illustrated intro is 40 s or less.", verification: [manual_review]}
      - {id: AC-S11-2, statement: "Skip works at any moment of the illustrated intro.", verification: [manual_review]}
      - {id: AC-S11-3, statement: "A tester who watched it all can say why the character wants a remote SWE job, and what went wrong by 2026.", verification: [manual_review]}
      - {id: AC-DOD-14, statement: "6 panels with captions, 40 s or less; hold-to-skip (desktop Esc also skips); plays on the first run only; Replay intro is on the title.", verification: [manual_review]}
  - id: MUST-17
    title: "Content minimums"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 17"}
    acceptance:
      - {id: AC-DOD-15, statement: "At least 15 knowledge questions, 10 ethics questions, 20 posting templates, 27 CV strings, 10 rejection lines and 15 tips ship in data/content.", verification: [behavioral_test]}
  - id: MUST-18
    title: "About 10 SFX"
    risk: standard
    source: {file: docs/GDD.md, section: "10.1 item 18; 9.2"}
    acceptance:
      - {id: AC-S12-1, statement: "Sound can be muted.", verification: [manual_review]}
      - {id: AC-DOD-16, statement: "About 10 sound effects ship (tap, apply, reject stamp, invite, hit, K.O., VS slam, BUSTED, typewriter, error).", verification: [manual_review]}

