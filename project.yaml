# docs/ROADMAP.md, docs/DECISIONS.md). This file is GENERATED from those docs: it never overrides them.
# If this file and a doc disagree, the doc wins; regenerate this file.
# Execution state lives in .project/state.json, not here.
# 2026-09-27: regenerated for docs v1.1 (D1 portrait, D2 270x480, P1 iPhone first). Changed statements follow
# the current docs; the prior wording is in git at 6f40919. Ids are never renumbered: replaced criteria and
# decisions stay below as superseded, linked to their replacements.
# 2026-09-29: updated for the Step 7 developer review (docs GDD 1.2, CONTENT 1.1, ARCHITECTURE 1.4, ROADMAP 1.2;
# DECISIONS D9-D12, C2-C4, W7). CV editing and lying were removed (D9): MUST-07 and AC-DOD-05 are retired, not
# deleted, and the statements that named the lie probe, BUSTED or the skippable VS intro follow the current docs.
# The prior wording is in git at 8aaae75.
# 2026-10-07: Run Spec v1 merged into the docs (branch run-spec-v1-merge; docs/merge-report.md; DECISIONS W8):
# GDD 2.0, CONTENT 1.2, ARCHITECTURE 1.5, ROADMAP 1.3. Indexed here: the developer's decisions of that day (W9: M1
# starts now, a convention below; D-26: Phase 1's stats only feed the duel; D-27: Negotiate removed, so D7 is
# superseded and SHOULD-02 and AC-S08-2 are retired, not deleted; D-28: E04's lease negotiation removed too), the
# Run Spec's decisions D-01..D-25, P-01..P-08 and Q-01..Q-07, its requirements R-* (each with criteria; the
# milestones' Done-when items are the AC-S14..AC-S19 criteria), AD-14, INV-20, the new docs as artifacts, a
# BASE-RUNSPEC baseline, and the tasks STEP-14..STEP-19 (= M1-M6, A53), with STEP-14 next (W9). The merge changed
# no code. Open conflicts (MC-nn) live in docs/merge-report.md, not here.
