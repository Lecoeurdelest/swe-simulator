  - {id: AD-14, title: "The career run - a pure, deterministic GDScript sim core that bots play headless; content as data; a presentation that knows no rules; the duel and the contract behind an adapter; a run log of inputs and outcomes", status: accepted, source: "ARCHITECTURE 0.11, 19.1; Run Spec v1 section 13; DECISIONS A55, A56"}
  # GDD section 12 and docs/DECISIONS.md: answered by the developer on 2026-09-26 (proposed until then).
  # `default` keeps the first draft's recommended default; `answer` is the decision.
  - {id: D1, title: "Orientation", status: accepted, answer: "portrait only (orientation = 1, no upside-down)", default: "(a) landscape only, sensor", decided: "2026-09-26", source: "GDD 12; GDD 2.1; docs/DECISIONS.md"}
