    decision_ids: [D5, AD-03, AD-06]
    depends_on: [STEP-02]
    acceptance_ids: [AC-S03-1, AC-S03-2, AC-S03-3, AC-S03-4, AC-S03-5]
  - id: STEP-04
    title: "Interview grey-box"
    source: {file: docs/ROADMAP.md, section: "Step 4"}
    hours: 14
