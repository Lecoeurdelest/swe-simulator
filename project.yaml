tasks:
  # One task per ROADMAP step. The step's "Tasks", "You do" and "Pitfalls" in docs/ROADMAP.md are the
  # detailed specification; bundles in .project/bundles/ collect the context for one step.
  # Estimate note: the ROADMAP's own step hours and the 2x rule replace the skill's 5-hour split guideline;
  # the numbered tasks inside each step are the work units.
  - id: STEP-00
    title: "Tools, decisions and reading"
    source: {file: docs/ROADMAP.md, section: "Step 0"}
    hours: 3
    requirement_ids: [MUST-01, REQ-TOOLCHAIN, REQ-DECISIONS]
    component_ids: [CMP-REPO, CMP-DOCS]
    # D4 stays: Step 0 answered it, and D9 superseded it on 2026-09-29, so the validator warns that D4 is no
    # longer accepted. That warning is expected. The same goes for D7, superseded by D-27 on 2026-10-07.
    decision_ids: [D1, D2, D3, D4, D5, D6, D7, D8, P1]
    depends_on: []
    acceptance_ids: [AC-S00-1, AC-S00-2, AC-S00-3]
    outputs: [docs/DECISIONS.md]
    out_of_scope: ["Rewriting the GDD (ROADMAP Step 0 pitfalls)"]
  - id: STEP-01
    title: "Project foundation"
    source: {file: docs/ROADMAP.md, section: "Step 1"}
    hours: 3
    requirement_ids: [MUST-01, MUST-03, REQ-LEARN]
    component_ids: [CMP-REPO, CMP-CORE, CMP-AUTOLOAD, CMP-DATA, CMP-UI, CMP-TITLE, CMP-TESTS]
    decision_ids: [D1, D2, AD-11, AD-12, AD-04, AD-05, AD-07, AD-08, AD-09]
    depends_on: []
    preconditions: ["Step 0 task 1 (git installed)"]
    acceptance_ids: [AC-S01-1, AC-S01-2, AC-S01-3, AC-S01-4, AC-S01-5, AC-S01-6]
    outputs: [project.godot, .gitignore, .gitattributes, core/, autoload/, data/types/, ui/components/safe_area_margin.gd, features/title/, tests/]
    amendments: ["2026-09-26 portrait switch (D1, D2): viewport 270x480, window override 540x960, orientation 1; Device reads its base size from Project Settings (ROADMAP Step 1 status and task 10)"]
    out_of_scope: ["gui/theme/custom (Step 3)"]
  - id: STEP-02
    title: "Hello iPhone: the iOS debug build from the MacBook"
    source: {file: docs/ROADMAP.md, section: "Step 2"}
    hours: 5
    timebox_hours: 6
    machine: "MacBook (the device-check scene can be built on either machine)"
    requirement_ids: [MUST-01, MUST-02, MUST-15, REQ-UI]
    component_ids: [CMP-EXPORT, CMP-DEV, CMP-TITLE, CMP-UI]
    decision_ids: [D1, D2, P1, AD-11, AD-12, AD-13]
    depends_on: [STEP-01]
    preconditions: ["The Step 1 portrait commit is pushed", "The MacBook, the iPhone and its USB cable are at hand"]
    acceptance_ids: [AC-S02-8, AC-S02-9, AC-S02-10, AC-S02-11, AC-S02-12, AC-S02-13, AC-S02-14, AC-S02-15, AC-S02-16, AC-S02-17, AC-S02-18, AC-S02-19]
    superseded_acceptance_ids: [AC-S02-1, AC-S02-2, AC-S02-3, AC-S02-4, AC-S02-5, AC-S02-6, AC-S02-7]
    outputs: [features/dev/device_check.tscn, export_presets.cfg, ui/fonts/monogram/ttf/monogram.ttf, ui/fonts/PressStart2P-Regular.ttf, ui/fonts/OFL.txt, "docs/ARCHITECTURE.md section 18.1 results (and GDD 2.9 if the insets differ)"]
    out_of_scope: ["Android export and Google Play (LATER, ARCHITECTURE 13.2)", "The paid Apple Developer Program and TestFlight (Step 13)"]
    note: "Redefined on 2026-09-27 from the Android 'Hello phone' step (P1). AC-S02-1..7 were never evaluated; each links to its replacement."
  - id: STEP-03
    title: "Stub flow through every screen, plus the UI kit"
    source: {file: docs/ROADMAP.md, section: "Step 3"}
    hours: 8
    requirement_ids: [REQ-FLOW, MUST-03, MUST-04, MUST-15, REQ-UI]
    component_ids: [CMP-UI, CMP-DATA, CMP-TITLE, CMP-INTRO, CMP-BGSELECT, CMP-HUNT, CMP-INTERVIEW, CMP-ENDINGS]
    decision_ids: [D5, AD-03, AD-06]
    depends_on: [STEP-02]
    acceptance_ids: [AC-S03-1, AC-S03-2, AC-S03-3, AC-S03-4, AC-S03-5]
  - id: STEP-04
    title: "Interview grey-box"
    source: {file: docs/ROADMAP.md, section: "Step 4"}
    hours: 14
    requirement_ids: [MUST-03, MUST-09, MUST-10, MUST-11, MUST-14, MUST-15, MUST-17]
    component_ids: [CMP-INTERVIEW, CMP-CONTENT, CMP-CORE, CMP-TESTS, CMP-DEV]
    # 2026-09-29: D9, D12 and C3 added; they changed what this step built (see amendments).
    decision_ids: [D3, D8, C1, D9, D12, C3]
    depends_on: [STEP-03]
    acceptance_ids: [AC-S04-1, AC-S04-2, AC-S04-3, AC-S04-4, AC-S04-5]
    amendments: ["2026-09-29 Step 7 developer review (ISSUE-10): the lie probe removed (D9, d8db453); the VS intro holds its last frame until a tap and shows one joke stat and one move (D12, 501def5); the choice questions in plain language (C3, 5c0f968); the real HpBar with the 0.4 s white ghost replaced the placeholder (W7, 8aaae75)"]
  - id: STEP-05
    title: "Job-hunt grey-box"
    source: {file: docs/ROADMAP.md, section: "Step 5"}
    hours: 16
    requirement_ids: [MUST-05, MUST-06, MUST-07, MUST-08, MUST-13, MUST-15, MUST-17, REQ-TONE]
    component_ids: [CMP-HUNT, CMP-BGSELECT, CMP-CONTENT, CMP-CORE, CMP-TESTS]
    # 2026-09-29: D4 (this step's huddle) was superseded by D9, which removed the CV screen this step built;
    # D11 and C2 changed its coach marks and the Graduate's perk text (see amendments).
    decision_ids: [D9, D6, D11, C2]
    depends_on: [STEP-04]
    acceptance_ids: [AC-S05-1, AC-S05-2, AC-S05-3, AC-S05-4, AC-S05-5]
    amendments: ["2026-09-29 Step 7 developer review (ISSUE-10): the CV screen, Lie lines and the lie-probe trigger removed, the dock is 4 slots (D9, d8db453); coach marks close on a tap (D11, e255e6f); the Graduate's perk says knowledge question (C2, 5c0f968); the real StatBar replaced the placeholder (W7, 8aaae75)"]
  - id: STEP-06
    title: "Offer, endings, save/resume, Back, intro text slides"
    source: {file: docs/ROADMAP.md, section: "Step 6"}
    hours: 10
    requirement_ids: [REQ-FLOW, MUST-12, MUST-13, MUST-15, MUST-16, MUST-17, REQ-REL]
