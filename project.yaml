# Structured index of the accepted plan (docs/GDD.md, docs/CONTENT.md, docs/ARCHITECTURE.md,
# docs/ROADMAP.md). This file is GENERATED from those docs: it never overrides them.
# If this file and a doc disagree, the doc wins; regenerate this file.
# Execution state lives in .project/state.json, not here.
schema_version: 1

project:
  id: swe-simulator
  title: SWE Simulator (MVP)
  plan_file: docs/GDD.md
  plan_files:
    - docs/GDD.md
    - docs/CONTENT.md
    - docs/ARCHITECTURE.md
    - docs/ROADMAP.md
  model_authorship: generated
  engine: Godot 4.7.2-stable, GDScript, gl_compatibility
  authority_order:
    - "Rules and numbers: docs/GDD.md wins; fix ARCHITECTURE.md (ARCHITECTURE header)."
    - "Engine facts: docs/ARCHITECTURE.md wins; fix GDD.md (ARCHITECTURE header)."
    - "Every player-facing string and content id: docs/CONTENT.md."
    - "Step plan, task breakdown and Done-when criteria: docs/ROADMAP.md."
    - "Design decision answers: docs/DECISIONS.md (one line each), once it exists (ROADMAP Step 0)."
    - "Execution state and evidence: .project/state.json and .project/evidence/."

preservation:
  baselines:
    - id: BASE-DOCS
      source: docs/GDD.md, docs/CONTENT.md, docs/ARCHITECTURE.md, docs/ROADMAP.md (all v1.0, 2026-09-26)
      revision: 64ed38f (last commit touching docs/)
    - id: BASE-CODE
      source: Step 1 foundation code copied from ARCHITECTURE section 17
      revision: 64ed38f
  artifacts:
    - id: ART-GDD
      path: docs/GDD.md
      role: design source of truth (rules, numbers, MUST/SHOULD/LATER scope, decisions D1-D8)
      disposition: preserve
    - id: ART-CONTENT
      path: docs/CONTENT.md
      role: every player-facing string and content id
      disposition: preserve
    - id: ART-ARCH
      path: docs/ARCHITECTURE.md
      role: engine facts, codebase rules, verified code skeletons
      disposition: preserve
    - id: ART-ROADMAP
      path: docs/ROADMAP.md
      role: step plan; each step's Tasks and Done-when are the human-readable task specification and sign-off checklist
      disposition: preserve
    - id: ART-CORE
      path: core/*.gd
      role: pure rule classes GameFlow, RunState, SaveIO, Odds
      disposition: preserve
    - id: ART-AUTOLOAD
      path: autoload/*.gd
      role: autoloads Content, GameState, Device, SceneRouter
      disposition: preserve
    - id: ART-TESTS
      path: tests/test_*.gd
      role: godot-ai test suites (McpTestSuite, @tool)
      disposition: preserve
    - id: ART-DATA-TYPES
      path: data/types/*.gd
      role: TierData, BackgroundData, BalanceConfig resource classes
      disposition: preserve
  conventions:
    - "ROADMAP step numbers are stable task ids (STEP-00 .. STEP-13); never renumber them."
    - "ROADMAP Done-when checkboxes are ticked by the developer; the three-marker index in docs/task/README.md is generated from .project/state.json and never replaces them."
    - "A design change is one line with a reason in docs/DECISIONS.md; the GDD is not rewritten (ROADMAP Step 0 pitfalls)."
    - "Claude never changes a design decision silently; open questions go to the step's design huddle (ROADMAP 10)."
    - "Scope is tagged MUST / SHOULD / LATER; a new idea replaces something and never just adds; new ideas go to docs/ideas_parking_lot.md (ROADMAP 1, risk 1)."
    - "ARCHITECTURE section 17 code skeletons are copied verbatim."
    - "Tuning lives in the 7 .tres files and text in the 16 JSON files; rebalancing never needs a script edit (ROADMAP 1)."
    - "Every step keeps its You-do task for the developer's own hands; Claude does not do it for them (ROADMAP 4, risk 8)."
    - "The developer commits; Claude suggests the message and commits before script_patch or engine updates (ROADMAP 10, ARCHITECTURE 14.3)."
    - "The 2x rule: a task past twice its estimate stops and is cut or simplified (ROADMAP 1)."
  status_dimensions:
    - execution
    - relevance
  approval_required_for:
    - remove
    - semantic_change
    - authority_change

components:
  - {id: CMP-REPO, title: "Project settings, git files, folders", paths: [project.godot, .gitignore, .gitattributes], source: "ARCHITECTURE 1.2, 2, 14"}
  - {id: CMP-CORE, title: "Pure rule classes (GameFlow, RunState, SaveIO, Odds)", paths: ["core/"], source: "ARCHITECTURE 3, 4, 7, 8, 17.1-17.4"}
  - {id: CMP-AUTOLOAD, title: "Autoloads (Content, GameState, Device, SceneRouter)", paths: ["autoload/"], source: "ARCHITECTURE 3, 5, 9, 17.6-17.9"}
  - {id: CMP-DATA, title: "Tuning resources (.tres) and their classes", paths: ["data/types/", "data/balance/", "data/backgrounds/", "data/tiers/"], source: "ARCHITECTURE 6.2, 17.5; GDD 11"}
  - {id: CMP-CONTENT, title: "JSON content (16 files keyed by id)", paths: ["data/content/"], source: "ARCHITECTURE 6.3-6.4; CONTENT"}
  - {id: CMP-UI, title: "Theme, fonts, shared components", paths: ["ui/"], source: "ARCHITECTURE 1.4, 1.5, 10, 17.10"}
  - {id: CMP-TITLE, title: "Title (S01)", paths: ["features/title/"], source: "ARCHITECTURE 11.1; GDD 4.2"}
  - {id: CMP-INTRO, title: "Intro cutscene (S02)", paths: ["features/intro/"], source: "ARCHITECTURE 11.2; CONTENT 2"}
  - {id: CMP-BGSELECT, title: "Background select (S03)", paths: ["features/background_select/"], source: "ARCHITECTURE 11.3; GDD 5.2"}
  - {id: CMP-HUNT, title: "Job hunt (S04-S06)", paths: ["features/job_hunt/"], source: "ARCHITECTURE 11.4; GDD 5.3-5.7"}
  - {id: CMP-INTERVIEW, title: "VS intro and interview (S07-S09)", paths: ["features/interview/"], source: "ARCHITECTURE 11.5-11.6, 17.11; GDD 5.8"}
  - {id: CMP-ENDINGS, title: "Offer, Hired card, Plan B (S10-S12)", paths: ["features/offer/", "features/phase2_stub/", "features/game_over/"], source: "ARCHITECTURE 11.7; GDD 5.9-5.10"}
  - {id: CMP-DEV, title: "Debug-only tools (device check, run report)", paths: ["features/dev/"], source: "ROADMAP Step 2, Step 7"}
  - {id: CMP-TESTS, title: "godot-ai test suites", paths: ["tests/"], source: "ARCHITECTURE 12; GDD 10.6"}
  - {id: CMP-EXPORT, title: "Android export and release", paths: [export_presets.cfg], source: "ARCHITECTURE 13"}
  - {id: CMP-ART, title: "Art assets and style guide", paths: ["art/", "art_src/", "features/*/art/"], source: "ROADMAP 5; GDD 2.5-2.6"}
  - {id: CMP-AUDIO, title: "Audio", paths: ["audio/"], source: "ROADMAP 6; GDD 9.2"}
  - {id: CMP-DOCS, title: "Decision log, credits, devlog", paths: [docs/DECISIONS.md, CREDITS.md, docs/devlog.md], source: "ROADMAP 1, 5, 9"}

decisions:
  # ARCHITECTURE section 0: accepted engineering decisions.
  - {id: AD-01, title: "480x270 base, viewport + expand + integer, runtime scale guard with fractional fallback", status: accepted, source: "ARCHITECTURE 0.1"}
  - {id: AD-02, title: "Landscape only, either way up; only the job-card swipe reads raw touch", status: accepted, source: "ARCHITECTURE 0.2"}
  - {id: AD-03, title: "monogram 16 for body text; Press Start 2P only for logo, VS screen, banners", status: accepted, source: "ARCHITECTURE 0.3"}
  - {id: AD-04, title: "Folders by feature, plus core/, data/, ui/", status: accepted, source: "ARCHITECTURE 0.4"}
  - {id: AD-05, title: "Four autoloads, no event bus, four pure @tool classes", status: accepted, source: "ARCHITECTURE 0.5"}
  - {id: AD-06, title: "Numbers in 7 .tres files, text in 16 JSON files; companies are JSON only", status: accepted, source: "ARCHITECTURE 0.6"}
  - {id: AD-07, title: "One seeded RNG per run, one per interview from a checkpoint; 64-bit values saved as strings", status: accepted, source: "ARCHITECTURE 0.7"}
  - {id: AD-08, title: "One JSON save in user://, written only while a run is live, after every commit and on focus loss", status: accepted, source: "ARCHITECTURE 0.8"}
  - {id: AD-09, title: "Rules in pure code the editor tests can run; scenes only display and call GameState verbs", status: accepted, source: "ARCHITECTURE 0.9"}
  - {id: AD-10, title: "Android first; iOS LATER", status: accepted, source: "ARCHITECTURE 0.10"}
  # GDD section 12: open until the developer answers them in docs/DECISIONS.md (ROADMAP Step 0).
  # Building proceeds on the recommended default (GDD 12), so dependent tasks are not blocked.
  - {id: D1, title: "Orientation", status: proposed, default: "(a) landscape only, sensor", source: "GDD 12"}
  - {id: D2, title: "Base resolution", status: proposed, default: "(a) 480x270, viewport + integer + guard", source: "GDD 12"}
  - {id: D3, title: "Knowledge-question mechanic", status: proposed, default: "(a) one-tap Answer Meter", source: "GDD 12"}
  - {id: D4, title: "Lying depth", status: proposed, default: "(a) 3 CV lines x Honest/Polished/Lie + Come clean/Bluff + background check for degree lies", source: "GDD 12"}
  - {id: D5, title: "Fail state", status: proposed, default: "(a) one Plan B ending, grace day, one-tap retry", source: "GDD 12"}
  - {id: D6, title: "Customization depth", status: proposed, default: "(a) background + name dice", source: "GDD 12"}
  - {id: D7, title: "Negotiation", status: proposed, default: "(b) one-tap Negotiate, first SHOULD after Research", source: "GDD 12"}
  - {id: D8, title: "Interview brutality (run length)", status: proposed, default: "(a) Doubt HP 118/128/132 for playtest #1, then decide", source: "GDD 12"}

