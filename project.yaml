  - {id: D3, title: "Knowledge-question mechanic", status: accepted, answer: "the default: one-tap Answer Meter", default: "(a) one-tap Answer Meter", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D4, title: "Lying depth", status: superseded, superseded_by: [D9], answer: "the default", default: "(a) 3 CV lines x Honest/Polished/Lie + Come clean/Bluff + background check for degree lies", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D5, title: "Fail state", status: accepted, answer: "the default", default: "(a) one Plan B ending, grace day, one-tap retry", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D6, title: "Customization depth", status: accepted, answer: "the default; cosmetics LATER", default: "(a) background + name dice", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D7, title: "Negotiation", status: superseded, superseded_by: [D-27], superseded_on: "2026-10-07", answer: "the default: once, never rescinded", default: "(b) one-tap Negotiate, first SHOULD after Research", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D8, title: "Interview brutality (run length)", status: accepted, answer: "the default; revisit after Playtest #1 (Step 7)", default: "(a) Doubt HP 118/128/132 for playtest #1, then decide", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: P1, title: "Platform", status: accepted, answer: "iPhone first, built and deployed from the developer's MacBook (Xcode, free Personal Team signing); Android LATER (no Android phone to test on)", decided: "2026-09-26", source: "GDD 12; GDD 2.10; docs/DECISIONS.md"}
  - {id: C1, title: "Parody names after a trademark web check", status: accepted, answer: "12 parody names renamed (e.g. SynergAI -> Hierarchai, HireBot 3000 -> Parsinator 3000); content ids unchanged; a real trademark search still runs before any public release", decided: "2026-09-26", source: "docs/DECISIONS.md; CONTENT 1.1, 4"}
  # docs/DECISIONS.md, decided by the developer in the Step 7 review of the v0.1 grey-box (2026-09-29).
  - {id: D9, title: "CV editing and lying removed", status: accepted, supersedes: D4, answer: "no CV screen, no Lie variants, no lie probe (Come clean / Bluff / BUSTED), no background check, no OFFER RESCINDED; Quick Apply sends the background's true CV, Tailor & Apply its honest Polished lines; no separate Polish CV button (no stat fits)", decided: "2026-09-29", source: "GDD 5.4, 12; docs/DECISIONS.md"}
  - {id: D10, title: "Best Dream score per background", status: accepted, answer: "LATER", decided: "2026-09-29", source: "GDD 3.1, 10.3, 12; docs/DECISIONS.md"}
  - {id: D11, title: "Coach marks close on a tap", status: accepted, answer: "a tap on the Ducky note closes a first-run coach mark for the run (small x hint); doing the action still closes it", decided: "2026-09-29", source: "GDD 4.3, 12; docs/DECISIONS.md"}
  - {id: D12, title: "The VS intro waits for a tap and shows less text", status: accepted, answer: "the 2.0 s clip holds its last frame with a blinking Tap to continue; Dana's plate shows one joke stat and one special move, in turn", decided: "2026-09-29", source: "GDD S07, 12; docs/DECISIONS.md"}
  - {id: C2, title: "Review-queue copy approved, 4 wording fixes", status: accepted, answer: "section 3 copy as written; Graduate perk says knowledge question; no doubled period after a company name; fine print never repeats a perk; GDD coach_sleep line matches the JSON", decided: "2026-09-29", source: "docs/DECISIONS.md; CONTENT 3.1, 13.3"}
  - {id: C3, title: "Choice questions in plain language", status: accepted, answer: "all 14 choice questions checked for non-tech players (11 reworded, 3 already plain kept); ids, kinds, tiers and tips unchanged (A49 later gave eq_harsh_review its own tip)", decided: "2026-09-29", source: "docs/DECISIONS.md; CONTENT 7"}
  - {id: C4, title: "New Hired-card copy", status: accepted, answer: "header YOUR JOB vs REMY'S VIDEO, the four video rows naming Remy's value, grade 1 All reality, no dream, footer 100 is the life in Remy's video. Nobody gets 100. Not even Remy.", decided: "2026-09-29", source: "docs/DECISIONS.md; GDD 5.9.5; CONTENT 14"}
  # docs/DECISIONS.md, decided by the developer on 2026-10-07 during the Run Spec v1 merge (the D- series, A60).
  - {id: D-26, title: "Phase 1 stats in the career run", status: accepted, answer: "KNOWLEDGE, EXPERIENCE and NETWORK stay at the background's starting values and only feed the duel (knowledge P, the committee wheel); Study, callbacks and offers do not touch them (for now)", decided: "2026-10-07", source: "GDD 5.1, 12; docs/DECISIONS.md; docs/merge-report.md MC-02"}
  - {id: D-27, title: "Offer negotiation removed", status: accepted, supersedes: D7, answer: "no Negotiate anywhere: neither Phase 1's one-tap Negotiate (SHOULD, never built) nor the Run Spec's R-JOB-04 version; the contract modal is Accept or Decline; the Handbook keeps 4 Edge tips; the existing negotiation code leaves with the next code change", decided: "2026-10-07", source: "GDD 5.9.3, 10.2, 12; docs/DECISIONS.md"}
  - {id: D-28, title: "Lease negotiation removed", status: accepted, answer: "E04 (lease renewal) is accept the +10% rent or move down a tier; its negotiate choice and the Landlords negotiate too tip go; E04 has no Ducky tip for now; no negotiation is left in the game", decided: "2026-10-07", source: "GDD 12; docs/DECISIONS.md; docs/merge-report.md MC-21"}
  - {id: D-29, title: "The first tuning is accepted (A74)", status: accepted, answer: "ticket_deadline_mult 1.5, review_standin_damage 0.37 and floor_doubt_step 0.16 stay; the median run and the loss mix are left for M4", decided: "2026-10-08", source: "docs/DECISIONS.md; docs/REVIEW_QUEUE.md 0.6"}
  - {id: D-30, title: "MC-04: starting savings are about one month of expenses", status: accepted, answer: "BackgroundData.start_savings_months 1.0 (Intern) / 0.8 (Graduate, Self-Taught); was 0.5 / 0.4 / 0.4", decided: "2026-10-08", source: "GDD 11.7; docs/DECISIONS.md; docs/merge-report.md MC-04"}
  - {id: D-31, title: "The Handbook's strength is left until M6", status: accepted, answer: "no change now; the full Handbook roughly doubles the Planner's wins (D-18 intends about 15% of total power)", decided: "2026-10-08", source: "GDD 5.21; docs/DECISIONS.md"}
  - {id: D-32, title: "MC-03: what a background changes in the career run", status: accepted, answer: "the duel's inputs, starting savings and the commute (the Dream score) only; the harder backgrounds' win rates are revisited at M4", decided: "2026-10-08", source: "GDD 5.2, 6; docs/DECISIONS.md; docs/merge-report.md MC-03"}
  - {id: D-33, title: "MC-01 (the rest): Steps 7-13 follow the career run", status: accepted, answer: "Playtest #1 folds into the M2 gate; R-BAL replaces Step 7's Phase 1 balance sim (ISSUE-09 goes with it); drag-to-sign moves to M3 and the other hunt SHOULDs are parked; the art and release steps (9-13) come after M4; v0.5-mvp ships the career run", decided: "2026-10-08", source: "ROADMAP 12; docs/DECISIONS.md; docs/merge-report.md MC-01"}
  - {id: D-34, title: "The other proposed resolutions of the merge report are accepted", status: accepted, answer: "MC-05, MC-06 (Hierarchai, Scope & Creep Digital, OmniGlobal Dynamics), MC-07..MC-20, MC-22 and MC-23 as proposed", decided: "2026-10-08", source: "docs/DECISIONS.md; docs/merge-report.md"}
  - {id: D-35, title: "The agent defaults A62-A76 are accepted", status: accepted, answer: "yes; none changed scope, tone or a tip", decided: "2026-10-08", source: "docs/DECISIONS.md"}
  - {id: D-36, title: "Scope of the career run: build every MUST and SHOULD", status: accepted, answer: "MUST = M1-M4 plus the Handbook; SHOULD = M5, the events beyond 26 and the Ducky writing pass; LATER = telemetry beyond a local run log", decided: "2026-10-08", source: "GDD 10.7; docs/DECISIONS.md"}
  - {id: D-37, title: "Tone and tip accuracy signed off for CONTENT 16's drafts and the 23 event tips", status: accepted, answer: "signed off, including the Burnout ending's line; later edits come back to the developer", decided: "2026-10-08", source: "CONTENT 16; GDD 8.1; docs/DECISIONS.md"}
  - {id: D-38, title: "INV-21..23 are added", status: accepted, answer: "the sim core is pure and deterministic; no time passes while the app is closed; a Junior has exactly one continuous control", decided: "2026-10-08", source: ".agent/rules/invariants.md; docs/DECISIONS.md"}
  # docs/DECISIONS.md, the Run Spec v1 rows (merged 2026-10-07, W8). D-01..D-25 are the spec's decision log
  # (basis Yours = the developer stated it; Unchallenged = the spec proposed it and nobody objected, so it can be
  # reopened). P-01..P-08 were the spec's proposals, accepted on 2026-10-07 by the developer's instruction for the
  # merge; Q-01..Q-07 its open questions, answered (Q-01 and Q-02 from the repo, Q-03..Q-07 at the spec's defaults).
  - {id: D-01, title: "A macro clock, about 1 in-game day per second; no cosmetics", status: accepted, basis: Yours, decided: "2026-10-01", source: "GDD 5.14; docs/DECISIONS.md"}
  - {id: D-02, title: "Run 1 starts employed; job 1 ends in a telegraphed, guaranteed layoff", status: accepted, basis: Yours, decided: "2026-10-01", source: "GDD 3.3, 5.19; docs/DECISIONS.md"}
  - {id: D-03, title: "The job hunt is a phone menu button; interviews stay the Dana duel", status: accepted, basis: Yours, decided: "2026-10-01", source: "GDD 5.20; docs/DECISIONS.md"}
  - {id: D-04, title: "One clock - unemployment is the same clock with salary 0", status: accepted, basis: Unchallenged, decided: "2026-10-01", partly_supersedes: [D5], note: "retires the day loop, the energy pips and the rent countdown with its grace day when the career run is built", source: "GDD 5.14; docs/DECISIONS.md"}
  - {id: D-05, title: "CV tailoring is dropped", status: accepted, basis: Yours, decided: "2026-10-01", partly_supersedes: [D9], note: "the part of D9 that kept Tailor & Apply", source: "GDD 5.4, 5.20; docs/DECISIONS.md"}
  - {id: D-06, title: "Playtime - sessions of 5-12 min, a run of 25-35 min, 2.5-4 h of content", status: accepted, basis: Unchallenged, decided: "2026-10-01", source: "GDD 3.2; docs/DECISIONS.md"}
  - {id: D-07, title: "Junior eye level - no project-manager mechanics at Junior", status: accepted, basis: Yours, decided: "2026-10-01", source: "GDD 5.17; docs/DECISIONS.md"}
  - {id: D-08, title: "A career roguelite - harder with each level, a near-inevitable loss, something persists", status: accepted, basis: Yours, decided: "2026-10-02", source: "GDD 0, 3.3, 5.21; docs/DECISIONS.md"}
  - {id: D-09, title: "Escalation comes from the company and the clock, not the title; the title caps at Senior", status: accepted, basis: Unchallenged, decided: "2026-10-02", source: "GDD 5.16, 5.18; docs/DECISIONS.md"}
  - {id: D-10, title: "Runway is the anti-coast mechanic - salary is fixed, expenses rise", status: accepted, basis: Unchallenged, decided: "2026-10-02", source: "GDD 5.15; docs/DECISIONS.md"}
  - {id: D-11, title: "A soft loss sends you to the job hunt with a Scar; a hard loss ends the run", status: accepted, basis: Unchallenged, decided: "2026-10-02", source: "GDD 3.3, 5.21; docs/DECISIONS.md"}
  - {id: D-12, title: "The Codebase (inherited tech debt) is the core system", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.16, 5.17; docs/DECISIONS.md"}
  - {id: D-13, title: "No time passes while the app is closed", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.14; docs/DECISIONS.md"}
  - {id: D-14, title: "A Junior has exactly one continuous control (the Hours slider, built as five notches - A58)", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.17; docs/DECISIONS.md"}
  - {id: D-15, title: "Win-rate target 5-10%", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 3.2, 5.22; docs/DECISIONS.md"}
  - {id: D-16, title: "At most 5 jobs per run, then a forced hard loss", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 3.3; docs/DECISIONS.md"}
  - {id: D-17, title: "Three company archetypes in v1", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.18; docs/DECISIONS.md"}
  - {id: D-18, title: "The Handbook grants options plus small, capped stat edges", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.21; docs/DECISIONS.md"}
  - {id: D-19, title: "The Studio is the canonical ending; the ClikClok-coach ending becomes the runway loss", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 3.3; docs/DECISIONS.md"}
  - {id: D-20, title: "Lifestyle creep ships in v1", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.15; docs/DECISIONS.md"}
  - {id: D-21, title: "No art budget - no commissioned art", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 2.5, 2.11; ROADMAP 5; docs/DECISIONS.md"}
  - {id: D-22, title: "The layoff meeting is a non-interactive scene", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 5.19; docs/DECISIONS.md"}
  - {id: D-23, title: "The first promotion is reachable inside job 1", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 3.3, 5.22; docs/DECISIONS.md"}
  - {id: D-24, title: "Win = The Studio as a Senior engineer; leaving tech is a loss ending", status: accepted, basis: Yours, decided: "2026-10-05", source: "GDD 3.4; docs/DECISIONS.md"}
  - {id: D-25, title: "Art stays the original docs' pixel-art style; the office diorama is drawn in it", status: accepted, basis: Yours, decided: "2026-10-07", source: "GDD 2.5, 2.11; docs/DECISIONS.md"}
  - {id: P-01, title: "Floor depth (job number 1-5) is the difficulty scalar; archetypes set flavor and rules", status: accepted, decided: "2026-10-07", source: "GDD 5.18, 6.1; R-ARC-02; docs/DECISIONS.md"}
  - {id: P-02, title: "The DoomApply board is the route map - each posting is a node you choose", status: accepted, decided: "2026-10-07", source: "GDD 5.20; R-JOB-01; docs/DECISIONS.md"}
  - {id: P-03, title: "Layoff selection is weighted by salary, not performance", status: accepted, decided: "2026-10-07", source: "GDD 5.19; R-EVT-03; docs/DECISIONS.md"}
  - {id: P-04, title: "Every Scar has counterplay; at most 3 stacks each", status: accepted, decided: "2026-10-07", source: "GDD 5.21; R-SCAR-01; docs/DECISIONS.md"}
  - {id: P-05, title: "The Studio = 5 conditions held for 90 days", status: accepted, decided: "2026-10-07", source: "GDD 3.4; R-WIN-01..08; docs/DECISIONS.md"}
  - {id: P-06, title: "Run 1's background is fixed - The Intern, converted to Junior", status: accepted, decided: "2026-10-07", source: "GDD 3.3, 5.2; docs/DECISIONS.md"}
  - {id: P-07, title: "The three archetypes are Startup, Agency and MegaCorp", status: accepted, decided: "2026-10-07", source: "GDD 5.18, 7.1; docs/DECISIONS.md"}
  - {id: P-08, title: "The performance review is a 3-prompt duel on the Dana duel UI", status: accepted, decided: "2026-10-07", source: "GDD 5.16, 5.19; docs/DECISIONS.md"}
  - {id: Q-01, title: "Engine and language", status: accepted, answer: "Godot 4.7.2 and GDScript; the sim core is GDScript too and runs headless", decided: "2026-10-07", source: "GDD 13.3; docs/DECISIONS.md"}
  - {id: Q-02, title: "The duel's stat names and which can be fed in", status: accepted, answer: "Composure (BackgroundData.composure_max), Doubt (TierData.doubt_hp) and the meter's half-width h (Odds.zone_half); none is a parameter today, so the adapter carries them in the interview checkpoint", decided: "2026-10-07", source: "GDD 13.4; ARCHITECTURE 19.5; docs/DECISIONS.md"}
  - {id: Q-03, title: "Startup, Agency and MegaCorp as the three archetypes", status: accepted, answer: "yes (= P-07)", decided: "2026-10-07", source: "GDD 13.3; docs/DECISIONS.md"}
  - {id: Q-04, title: "Five conditions held 90 days for The Studio", status: accepted, answer: "yes, tuned by the harness (= P-05)", decided: "2026-10-07", source: "GDD 13.3; docs/DECISIONS.md"}
  - {id: Q-05, title: "Run 1's background fixed to The Intern", status: accepted, answer: "yes (= P-06)", decided: "2026-10-07", source: "GDD 13.3; docs/DECISIONS.md"}
  - {id: Q-06, title: "A broken Studio hold", status: accepted, answer: "resets to zero", decided: "2026-10-07", source: "GDD 3.4, 13.3; docs/DECISIONS.md"}
  - {id: Q-07, title: "Layoff selection by salary, not performance", status: accepted, answer: "yes (= P-03)", decided: "2026-10-07", source: "GDD 13.3; docs/DECISIONS.md"}

