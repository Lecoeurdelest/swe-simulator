# Structured index of the accepted plan (docs/GDD.md, docs/CONTENT.md, docs/ARCHITECTURE.md,
# docs/ROADMAP.md, docs/DECISIONS.md). This file is GENERATED from those docs: it never overrides them.
# If this file and a doc disagree, the doc wins; regenerate this file.
# Execution state lives in .project/state.json, not here.
# 2026-09-27: regenerated for docs v1.1 (D1 portrait, D2 270x480, P1 iPhone first). Changed statements follow
# the current docs; the prior wording is in git at 6f40919. Ids are never renumbered: replaced criteria and
# decisions stay below as superseded, linked to their replacements.
schema_version: 1

project:
  id: swe-simulator
  title: SWE Simulator (MVP)
  plan_file: docs/GDD.md
  plan_files:
    - docs/GDD.md
    - docs/CONTENT.md
    - docs/ARCHITECTURE.md
    - docs/ROADMAP.md
    - docs/DECISIONS.md
  model_authorship: generated
  engine: "Godot 4.7.2-stable, GDScript, gl_compatibility (Steam build on the Windows PC, godotengine.org zip on the MacBook)"
  platform: "iPhone first, built on the MacBook (Xcode, free Personal Team signing); Android LATER (docs/DECISIONS.md P1)"
  authority_order:
    - "Rules and numbers: docs/GDD.md wins; fix ARCHITECTURE.md (ARCHITECTURE header)."
    - "Engine facts: docs/ARCHITECTURE.md wins; fix GDD.md (ARCHITECTURE header)."
    - "Every player-facing string and content id: docs/CONTENT.md."
    - "Step plan, task breakdown and Done-when criteria: docs/ROADMAP.md."
    - "Design decision answers: docs/DECISIONS.md (one line each; D1-D8, P1 and C1 since 2026-09-26). A change is a new superseding row there first, then the GDD section it points to (GDD 12)."
    - "Execution state and evidence: .project/state.json and .project/evidence/."

preservation:
  baselines:
    - id: BASE-DOCS
      source: docs/GDD.md, docs/CONTENT.md, docs/ARCHITECTURE.md, docs/ROADMAP.md (all v1.0, 2026-09-26)
      revision: 64ed38f (last commit touching docs/)
      superseded_by: BASE-DOCS-PORTRAIT
    - id: BASE-DOCS-PORTRAIT
      source: "docs/GDD.md, docs/CONTENT.md, docs/ARCHITECTURE.md, docs/ROADMAP.md (all v1.1, portrait and iPhone first) and docs/DECISIONS.md (new)"
      revision: "uncommitted on top of 6f40919 (Windows PC, 2026-09-27); sha256 of the four v1.1 docs in the 2026-09-27 .project/generated-manifest.json inputs; docs/DECISIONS.md, which render.py does not hash, e46ddcee7e7d1be9644f11456aca81f2eb8d79ae9ed26a055ee03d5d019c05d8. Replace with the commit id once pushed."
    - id: BASE-CODE
      source: Step 1 foundation code copied from ARCHITECTURE section 17
      revision: 64ed38f
    - id: BASE-CODE-PORTRAIT
      source: "Step 1 foundation plus the D1 portrait amendment (project.godot, autoload/device.gd, ui/components/safe_area_margin.gd)"
      revision: "uncommitted on top of 6f40919 (Windows PC, 2026-09-27)"
  artifacts:
    - id: ART-GDD
      path: docs/GDD.md
      role: design source of truth (rules, numbers, MUST/SHOULD/LATER scope, decisions D1-D8 and P1 in section 12)
      disposition: preserve
    - id: ART-CONTENT
      path: docs/CONTENT.md
      role: every player-facing string and content id
      disposition: preserve
    - id: ART-ARCH
      path: docs/ARCHITECTURE.md
      role: engine facts, codebase rules, verified code skeletons
      disposition: preserve
    - id: ART-ROADMAP
      path: docs/ROADMAP.md
      role: step plan; each step's Tasks and Done-when are the human-readable task specification and sign-off checklist
      disposition: preserve
    - id: ART-DECISIONS
      path: docs/DECISIONS.md
      role: decision log (D1-D8, P1, C1); one line per decision, changed only by a new superseding row
      disposition: preserve
    - id: ART-CORE
      path: core/*.gd
      role: pure rule classes GameFlow, RunState, SaveIO, Odds
      disposition: preserve
    - id: ART-AUTOLOAD
      path: autoload/*.gd
      role: autoloads Content, GameState, Device, SceneRouter
      disposition: preserve
    - id: ART-TESTS
      path: tests/test_*.gd
      role: godot-ai test suites (McpTestSuite, @tool)
      disposition: preserve
    - id: ART-DATA-TYPES
      path: data/types/*.gd
      role: TierData, BackgroundData, BalanceConfig resource classes
      disposition: preserve
  conventions:
    - "ROADMAP step numbers are stable task ids (STEP-00 .. STEP-13); never renumber them."
    - "ROADMAP Done-when checkboxes are ticked by the developer; the three-marker index in docs/task/README.md is generated from .project/state.json and never replaces them."
    # 2026-09-27: the next convention replaces "A design change is one line with a reason in docs/DECISIONS.md;
    # the GDD is not rewritten (ROADMAP Step 0 pitfalls)." The v1.1 docs (DECISIONS.md header, GDD 12) now update
    # the GDD section after the superseding row. Semantic change (approval_required_for): confirmed by the developer
    # in chat on 2026-09-27 ("That is OK").
    - "A design change is first a new one-line row with a reason in docs/DECISIONS.md, superseding (never rewriting) the old row; then the GDD section it points to is updated to match (DECISIONS.md header; GDD 12; ROADMAP Step 0 pitfalls)."
    - "Claude never changes a design decision silently; open questions go to the step's design huddle (ROADMAP 10)."
    - "Scope is tagged MUST / SHOULD / LATER; a new idea replaces something and never just adds; new ideas go to docs/ideas_parking_lot.md (ROADMAP 1, risk 1)."
    - "ARCHITECTURE section 17 code skeletons are copied verbatim."
    - "Tuning lives in the 7 .tres files and text in the 16 JSON files; rebalancing never needs a script edit (ROADMAP 1)."
    # 2026-09-27 (W3, W6; developer approved in chat): replaces "Every step keeps its You-do task for the developer's own hands;
    # Claude does not do it for them (ROADMAP 4, risk 8)." Still true; the placeholder and no-quiz rules are added.
    - "Every step keeps its You-do task for the developer; Claude never does it. Where a You-do produces something the game needs to run, Claude builds a plain placeholder and the proper version stays queued for the developer. Explanation checks are recorded from the developer's statement and never quizzed (DECISIONS W3, W6)."
    # 2026-09-27 (W1; developer approved in chat: "You can also push with git without stopping for my approvals"): replaces
    # "The developer commits; Claude suggests the message and commits before script_patch or engine updates (ROADMAP 10, ARCHITECTURE 14.3)."
    - "Claude commits after each verified increment on a per-step branch (step-NN-<slug>, each branched from the previous step's branch) and pushes without asking; it still commits before script_patch or engine updates. The developer reviews and merges on GitHub in step order with merge commits (DECISIONS W1; ARCHITECTURE 14.3)."
    - "Dependency gate: a step may start when every earlier step is done or has only developer-owned criteria left (device, You-do, manual review); those steps stay in_progress/verifying until the developer confirms (DECISIONS W2)."
    - "While the developer is away, design huddles take the documented recommended default, logged in docs/DECISIONS.md as 'agent default, please review'; scope, tone and tip accuracy wait for the developer (DECISIONS W4)."
    - "Current mode (2026-09-27): PC only (P2); autonomous run from Step 2's PC part through Step 6, with a summary after each step (DECISIONS W5)."
    - "The 2x rule: a task past twice its estimate stops and is cut or simplified (ROADMAP 1)."
    - "Two machines share the GitHub repo: everyday building on the Windows PC, iPhone builds on the MacBook; pull before you start, push before you switch, and run the same Godot 4.7.2 on both (ROADMAP 10; ARCHITECTURE 14.1)."
  status_dimensions:
    - execution
    - relevance
  approval_required_for:
    - remove
    - semantic_change
    - authority_change

components:
  - {id: CMP-REPO, title: "Project settings, git files, folders", paths: [project.godot, .gitignore, .gitattributes], source: "ARCHITECTURE 1.2, 2, 14"}
  - {id: CMP-CORE, title: "Pure rule classes (GameFlow, RunState, SaveIO, Odds)", paths: ["core/"], source: "ARCHITECTURE 3, 4, 7, 8, 17.1-17.4"}
  - {id: CMP-AUTOLOAD, title: "Autoloads (Content, GameState, Device, SceneRouter)", paths: ["autoload/"], source: "ARCHITECTURE 3, 5, 9, 17.6-17.9"}
  - {id: CMP-DATA, title: "Tuning resources (.tres) and their classes", paths: ["data/types/", "data/balance/", "data/backgrounds/", "data/tiers/"], source: "ARCHITECTURE 6.2, 17.5; GDD 11"}
  - {id: CMP-CONTENT, title: "JSON content (16 files keyed by id)", paths: ["data/content/"], source: "ARCHITECTURE 6.3-6.4; CONTENT"}
  - {id: CMP-UI, title: "Theme, fonts, shared components", paths: ["ui/"], source: "ARCHITECTURE 1.4, 1.5, 10, 17.10"}
  - {id: CMP-TITLE, title: "Title (S01)", paths: ["features/title/"], source: "ARCHITECTURE 11.1; GDD 4.2"}
  - {id: CMP-INTRO, title: "Intro cutscene (S02)", paths: ["features/intro/"], source: "ARCHITECTURE 11.2; CONTENT 2"}
  - {id: CMP-BGSELECT, title: "Background select (S03)", paths: ["features/background_select/"], source: "ARCHITECTURE 11.3; GDD 5.2"}
  - {id: CMP-HUNT, title: "Job hunt (S04-S06)", paths: ["features/job_hunt/"], source: "ARCHITECTURE 11.4; GDD 5.3-5.7"}
  - {id: CMP-INTERVIEW, title: "VS intro and interview (S07-S09)", paths: ["features/interview/"], source: "ARCHITECTURE 11.5-11.6, 17.11; GDD 5.8"}
  - {id: CMP-ENDINGS, title: "Offer, Hired card, Plan B (S10-S12)", paths: ["features/offer/", "features/phase2_stub/", "features/game_over/"], source: "ARCHITECTURE 11.7; GDD 5.9-5.10"}
  - {id: CMP-DEV, title: "Debug-only tools (device check, run report)", paths: ["features/dev/"], source: "ROADMAP Step 2, Step 7"}
  - {id: CMP-TESTS, title: "godot-ai test suites", paths: ["tests/"], source: "ARCHITECTURE 12; GDD 10.6"}
  - {id: CMP-EXPORT, title: "iOS export from the MacBook and the TestFlight release (Android LATER)", paths: [export_presets.cfg], source: "ARCHITECTURE 13.1, 13.2"}
  - {id: CMP-ART, title: "Art assets and style guide", paths: ["art/", "art_src/", "features/*/art/"], source: "ROADMAP 5; GDD 2.5-2.6"}
  - {id: CMP-AUDIO, title: "Audio", paths: ["audio/"], source: "ROADMAP 6; GDD 9.2"}
  - {id: CMP-DOCS, title: "Decision log, credits, devlog", paths: [docs/DECISIONS.md, CREDITS.md, docs/devlog.md], source: "ROADMAP 1, 5, 9"}

decisions:
  # ARCHITECTURE section 0: accepted engineering decisions.
  # AD-01, AD-02 and AD-10 were superseded on 2026-09-27 by AD-11..AD-13, which mirror ARCHITECTURE 0.1, 0.2
  # and 0.10 as rewritten for D2, D1 and P1. Ids are never renumbered. The supersession was confirmed by the
  # developer in chat on 2026-09-27.
  - {id: AD-01, title: "480x270 base, viewport + expand + integer, runtime scale guard with fractional fallback", status: superseded, superseded_by: [AD-11], approval: "D2 in docs/DECISIONS.md (developer, 2026-09-26)", source: "ARCHITECTURE 0.1 (v1.0)"}
  - {id: AD-02, title: "Landscape only, either way up; only the job-card swipe reads raw touch", status: superseded, superseded_by: [AD-12], approval: "D1 in docs/DECISIONS.md (developer, 2026-09-26)", source: "ARCHITECTURE 0.2 (v1.0)"}
  - {id: AD-03, title: "monogram 16 for body text; Press Start 2P only for logo, VS screen, banners", status: accepted, source: "ARCHITECTURE 0.3"}
  - {id: AD-04, title: "Folders by feature, plus core/, data/, ui/", status: accepted, source: "ARCHITECTURE 0.4"}
  - {id: AD-05, title: "Four autoloads, no event bus, four pure @tool classes", status: accepted, source: "ARCHITECTURE 0.5"}
  - {id: AD-06, title: "Numbers in 7 .tres files, text in 16 JSON files; companies are JSON only", status: accepted, source: "ARCHITECTURE 0.6"}
  - {id: AD-07, title: "One seeded RNG per run, one per interview from a checkpoint; 64-bit values saved as strings", status: accepted, source: "ARCHITECTURE 0.7"}
  - {id: AD-08, title: "One JSON save in user://, written only while a run is live, after every commit and on focus loss", status: accepted, source: "ARCHITECTURE 0.8"}
  - {id: AD-09, title: "Rules in pure code the editor tests can run; scenes only display and call GameState verbs", status: accepted, source: "ARCHITECTURE 0.9"}
  - {id: AD-10, title: "Android first; iOS LATER", status: superseded, superseded_by: [AD-13], approval: "P1 in docs/DECISIONS.md (developer, 2026-09-26)", source: "ARCHITECTURE 0.10 (v1.0)"}
  - {id: AD-11, title: "270x480 base (portrait), viewport + expand + integer, runtime scale guard with fractional fallback on SE- and 720p-class screens", status: accepted, supersedes: AD-01, source: "ARCHITECTURE 0.1; D2"}
  - {id: AD-12, title: "Portrait only (orientation 1, no upside-down), one thumb; only the job-card and background-card swipes read raw touch", status: accepted, supersedes: AD-02, source: "ARCHITECTURE 0.2; D1"}
  - {id: AD-13, title: "iPhone first: develop on the Windows PC, build on the MacBook (Xcode, free Personal Team signing); Android LATER", status: accepted, supersedes: AD-10, source: "ARCHITECTURE 0.10; P1"}
  # GDD section 12 and docs/DECISIONS.md: answered by the developer on 2026-09-26 (proposed until then).
  # `default` keeps the first draft's recommended default; `answer` is the decision.
  - {id: D1, title: "Orientation", status: accepted, answer: "portrait only (orientation = 1, no upside-down)", default: "(a) landscape only, sensor", decided: "2026-09-26", source: "GDD 12; GDD 2.1; docs/DECISIONS.md"}
  - {id: D2, title: "Base resolution", status: accepted, answer: "270x480 (the portrait mirror of 480x270), viewport + expand + integer + the Device scale guard", default: "(a) 480x270, viewport + integer + guard", decided: "2026-09-26", source: "GDD 12; GDD 2.2; docs/DECISIONS.md"}
  - {id: D3, title: "Knowledge-question mechanic", status: accepted, answer: "the default: one-tap Answer Meter", default: "(a) one-tap Answer Meter", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D4, title: "Lying depth", status: accepted, answer: "the default", default: "(a) 3 CV lines x Honest/Polished/Lie + Come clean/Bluff + background check for degree lies", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D5, title: "Fail state", status: accepted, answer: "the default", default: "(a) one Plan B ending, grace day, one-tap retry", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D6, title: "Customization depth", status: accepted, answer: "the default; cosmetics LATER", default: "(a) background + name dice", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D7, title: "Negotiation", status: accepted, answer: "the default: once, never rescinded", default: "(b) one-tap Negotiate, first SHOULD after Research", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: D8, title: "Interview brutality (run length)", status: accepted, answer: "the default; revisit after Playtest #1 (Step 7)", default: "(a) Doubt HP 118/128/132 for playtest #1, then decide", decided: "2026-09-26", source: "GDD 12; docs/DECISIONS.md"}
  - {id: P1, title: "Platform", status: accepted, answer: "iPhone first, built and deployed from the developer's MacBook (Xcode, free Personal Team signing); Android LATER (no Android phone to test on)", decided: "2026-09-26", source: "GDD 12; GDD 2.10; docs/DECISIONS.md"}
  - {id: C1, title: "Parody names after a trademark web check", status: accepted, answer: "12 parody names renamed (e.g. SynergAI -> Hierarchai, HireBot 3000 -> Parsinator 3000); content ids unchanged; a real trademark search still runs before any public release", decided: "2026-09-26", source: "docs/DECISIONS.md; CONTENT 1.1, 4"}

